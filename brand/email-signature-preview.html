<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AstraJax email signature preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3eddb;
        font-family: system-ui, sans-serif;
      }
      .frame {
        background: #ffffff;
        padding: 32px 36px;
        border: 1px solid rgba(35, 39, 27, 0.08);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(35, 39, 27, 0.08);
      }
      .label {
        margin: 0 0 20px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6e7b52;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="label">Email signature preview (on white, as in most inboxes)</p>
      <!-- signature start -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="font-family: Georgia, 'Times New Roman', Times, serif; font-size: 14px; line-height: 1.45; color: #23271B;">
        <tr>
          <td style="padding-right: 16px; vertical-align: top;">
            <a href="https://astrajax.com" style="text-decoration: none;">
              <img src="https://astrajax.com/astrajax-logo.png" alt="AstraJax" width="52" height="52" style="display: block; border: 0; outline: none;" />
            </a>
          </td>
          <td style="border-left: 3px solid #A95A2E; padding-left: 16px; vertical-align: top;">
            <p style="margin: 0 0 2px 0; font-size: 17px; font-weight: bold; color: #23271B; letter-spacing: -0.01em;">
              Matthew Hopkinson
            </p>
            <p style="margin: 0 0 8px 0; font-size: 13px; color: #5C6354; font-family: Arial, Helvetica, sans-serif;">
              Founder, AstraJax
            </p>
            <p style="margin: 0 0 10px 0; font-size: 12px; line-height: 1.55; color: #5C6354; font-family: Arial, Helvetica, sans-serif; max-width: 360px;">
              Helping commercial teams turn domain expertise into AI-ready operating systems.
            </p>
            <p style="margin: 0; font-size: 12px; font-family: Arial, Helvetica, sans-serif; line-height: 1.6;">
              <a href="mailto:matthew@astrajax.com" style="color: #A95A2E; text-decoration: none;">matthew@astrajax.com</a>
              <span style="color: #6E7B52;">&nbsp;&middot;&nbsp;</span>
              <a href="https://astrajax.com" style="color: #A95A2E; text-decoration: none;">astrajax.com</a>
              <span style="color: #6E7B52;">&nbsp;&middot;&nbsp;</span>
              <a href="https://www.linkedin.com/in/matthew-hopkinson-274b5a16a/" style="color: #A95A2E; text-decoration: none;">LinkedIn</a>
              <span style="color: #6E7B52;">&nbsp;&middot;&nbsp;</span>
              <a href="https://calendly.com/matthew-astrajax" style="color: #A95A2E; text-decoration: none;">Book a call</a>
            </p>
          </td>
        </tr>
      </table>
      <!-- signature end -->
    </div>
  </body>
</html>
