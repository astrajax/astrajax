<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!--
    Living Folio — Clive interaction mask (16:9, top-third right page).
    Absorbed-pigment alpha. One mask on the OUTERMOST wrapper only.

    ALPHA ARCHITECTURE (Kathryn dispatch, 6 Aug 2026) mirrors the teaching
    mask: three INDEPENDENTLY irregular absorption fields so no single
    closed contour survives — the prior uniform falloff let the dark
    bookshelf/fireplace pixels collect into a legible oval ring.

      1. SOLID CORE — 100% alpha; compact around Clive so the action
         ledger below retains its space; own displacement seed.
      2. MID WASH — a wider LOW strip: room detail extends laterally along
         the band, capped ~30-50% alpha, displaced differently, island-gated.
         Avoids a circular cameo.
      3. OUTER TRACE — sparse broken islands only, ~8-18% alpha, coarse
         paper-tooth breakup; cannot form a continuous closed loop.

    Every field reaches zero well before the SVG bounds. Alpha loss only.
    Luminance mask: white = opaque, grey = partial.
  -->
  <defs>
    <filter id="coreF" x="-10%" y="-12%" width="120%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.019 0.024" numOctaves="2" seed="9" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3.5" result="b"/>
      <feComponentTransfer in="b">
        <feFuncA type="table" tableValues="0 0.35 0.8 0.97 1 1"/>
      </feComponentTransfer>
    </filter>

    <filter id="midF" x="-16%" y="-20%" width="132%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.015" numOctaves="2" seed="33" result="sw"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.066" numOctaves="3" seed="71" result="fray"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="52" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feDisplacementMap in="d1" in2="fray" scale="16" xChannelSelector="R" yChannelSelector="G" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="8" result="b"/>
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.04 0.12 0.24 0.36 0.46 0.5 0.5"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.04" numOctaves="2" seed="17" result="patch"/>
      <feComponentTransfer in="patch" result="gate">
        <feFuncA type="table" tableValues="0 0 0.15 0.55 0.9 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="gate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="traceF" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.031" numOctaves="2" seed="47" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="64" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6" result="b"/>
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.02 0.06 0.11 0.16 0.18 0.18"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.12 0.15" numOctaves="2" seed="89" result="tooth"/>
      <feComponentTransfer in="tooth" result="toothGate">
        <feFuncA type="table" tableValues="0 0 0.1 0.45 0.8 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="toothGate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- 1. SOLID CORE: compact around Clive — face, torso, paws, book — so
         the ledger keeps its room below. -->
  <path fill="white" filter="url(#coreF)" d="
    M 330 130
    C 500 105, 740 102, 905 128
    C 1030 150, 1105 235, 1102 350
    C 1099 460, 1010 525, 870 552
    C 700 585, 490 572, 355 520
    C 240 475, 195 405, 205 325
    C 215 235, 245 148, 330 130
    Z"/>

  <!-- 2. MID WASH: a wide LOW strip — the room extends laterally along the
         band; books/lamp far left, fireplace far right; stays compact
         vertically so the composition never rounds into a cameo. -->
  <path fill="white" filter="url(#midF)" d="
    M 130 190
    C 170 130, 300 92, 480 78
    C 680 62, 900 68, 1050 96
    C 1160 118, 1230 175, 1246 260
    C 1260 345, 1240 450, 1190 520
    C 1120 595, 950 628, 740 636
    C 540 643, 340 628, 220 578
    C 115 535, 60 455, 68 355
    C 75 265, 100 235, 130 190
    Z"/>

  <!-- 3. OUTER TRACE: sparse broken islands only. Never a closed loop. -->
  <g filter="url(#traceF)">
    <path fill="white" d="M 92 250 C 128 220, 175 220, 192 258 C 208 294, 178 335, 132 335 C 92 335, 62 288, 92 250 Z"/>
    <path fill="white" d="M 250 108 C 300 82, 365 78, 390 104 C 412 128, 372 158, 310 156 C 258 154, 215 132, 250 108 Z"/>
    <path fill="white" d="M 590 52 C 655 38, 730 44, 752 68 C 770 88, 718 108, 640 104 C 578 101, 542 72, 590 52 Z"/>
    <path fill="white" d="M 950 72 C 1015 62, 1085 82, 1102 118 C 1115 148, 1060 172, 992 162 C 938 154, 908 102, 950 72 Z"/>
    <path fill="white" d="M 1180 175 C 1222 162, 1258 192, 1252 240 C 1247 285, 1202 308, 1168 288 C 1138 269, 1142 192, 1180 175 Z"/>
    <path fill="white" d="M 1195 430 C 1232 420, 1262 455, 1248 505 C 1235 550, 1192 568, 1162 545 C 1135 524, 1158 448, 1195 430 Z"/>
    <path fill="white" d="M 960 640 C 1015 628, 1072 646, 1078 678 C 1083 702, 1020 716, 958 706 C 912 698, 918 652, 960 640 Z"/>
    <path fill="white" d="M 600 662 C 665 655, 730 662, 742 684 C 750 700, 680 710, 610 704 C 560 699, 550 670, 600 662 Z"/>
    <path fill="white" d="M 280 600 C 330 592, 378 616, 372 648 C 366 678, 300 682, 255 662 C 220 646, 235 610, 280 600 Z"/>
    <path fill="white" d="M 72 470 C 112 452, 152 478, 148 525 C 144 570, 98 595, 62 575 C 32 557, 38 492, 72 470 Z"/>
  </g>
</svg>
