<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Living Folio — Clive interaction mask (16:9). v6.
       Pure-vector absorbed pigment. v5 passed the cold gate but read too
       eaten. v6 broadens the wash into fewer, larger irregular fields that
       stay disconnected (no continuous contour). Solid core compact on Clive;
       ledger keeps its room. -->
  <defs>
    <filter id="broad" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.042" numOctaves="2" seed="22" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- SOLID CORE: compact around Clive (face, torso, paws, book). -->
  <path fill="white" filter="url(#rough)" d="
    M 448 150
    C 562 122, 722 122, 834 152
    C 925 177, 975 252, 971 352
    C 967 448, 905 513, 805 538
    C 688 566, 548 556, 455 510
    C 372 470, 344 402, 356 327
    C 368 249, 392 165, 448 150
    Z"/>

  <!-- Broad absorption fields, wide low strip, no continuous contour. -->
  <!-- LEFT: lamp + shelf wash -->
  <path fill="white" opacity="0.5" filter="url(#broad)" d="
    M 140 210
    C 130 145, 220 108, 330 105
    C 420 102, 490 138, 505 205
    C 518 265, 495 335, 435 372
    C 378 406, 285 412, 215 385
    C 158 362, 128 308, 132 248
    C 134 226, 132 218, 140 210
    Z"/>
  <path fill="white" opacity="0.4" filter="url(#broad)" d="
    M 122 400
    C 160 368, 240 368, 288 405
    C 330 438, 328 505, 275 538
    C 228 568, 145 558, 115 508
    C 92 468, 92 428, 122 400
    Z"/>
  <!-- RIGHT: fireplace wash -->
  <path fill="white" opacity="0.48" filter="url(#broad)" d="
    M 880 190
    C 935 152, 1035 150, 1098 195
    C 1152 234, 1165 312, 1128 372
    C 1094 425, 1008 448, 945 422
    C 890 400, 862 340, 872 275
    C 878 232, 858 208, 880 190
    Z"/>
  <path fill="white" opacity="0.38" filter="url(#broad)" d="
    M 900 470
    C 955 448, 1040 458, 1078 505
    C 1110 545, 1088 612, 1025 635
    C 968 655, 888 632, 868 575
    C 855 532, 862 488, 900 470
    Z"/>
  <!-- TOP shelf loss -->
  <path fill="white" opacity="0.42" filter="url(#broad)" d="
    M 420 92
    C 510 62, 660 58, 770 76
    C 855 90, 910 122, 902 152
    C 895 182, 795 198, 670 196
    C 545 194, 435 168, 422 132
    C 414 112, 406 98, 420 92
    Z"/>
  <!-- BOTTOM: quiet fade under shoulders/book -->
  <path fill="white" opacity="0.44" filter="url(#broad)" d="
    M 360 560
    C 455 535, 600 538, 705 562
    C 795 582, 855 622, 848 655
    C 840 688, 730 712, 605 708
    C 485 704, 372 668, 355 615
    C 346 588, 342 570, 360 560
    Z"/>
  <g filter="url(#broad)">
    <circle cx="98" cy="290" r="40" fill="white" opacity="0.15"/>
    <circle cx="1180" cy="380" r="36" fill="white" opacity="0.14"/>
    <circle cx="290" cy="640" r="38" fill="white" opacity="0.13"/>
    <circle cx="980" cy="660" r="34" fill="white" opacity="0.12"/>
  </g>
</svg>
