<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Living Folio — Clive interaction mask (16:9). v5.
       Pure-vector absorbed-pigment alpha. Self-contained (no raster).
       SOLID CORE compact on Clive (ledger keeps its room) + broken,
       disconnected islands. No continuous closed contour anywhere. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.033 0.045" numOctaves="2" seed="22" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="28" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- SOLID CORE: compact around Clive (face, torso, paws, book). -->
  <path fill="white" filter="url(#rough)" d="
    M 445 150
    C 560 122, 720 122, 832 152
    C 922 176, 972 250, 968 350
    C 964 445, 902 510, 802 535
    C 685 563, 545 553, 452 507
    C 368 466, 340 400, 352 325
    C 364 247, 388 165, 445 150
    Z"/>

  <!-- Pigment islands — wide low strip, disconnected, low-alpha. -->
  <g filter="url(#soft)">
    <path fill="white" opacity="0.46" d="M 155 230 C 195 175, 290 155, 350 195 C 400 228, 392 300, 335 328 C 282 352, 195 338, 165 290 C 148 262, 138 258, 155 230 Z"/>
    <path fill="white" opacity="0.38" d="M 118 400 C 160 378, 222 392, 232 440 C 240 482, 195 518, 142 508 C 100 500, 88 428, 118 400 Z"/>
    <path fill="white" opacity="0.42" d="M 358 540 C 440 520, 560 528, 610 570 C 652 605, 585 660, 480 658 C 395 656, 320 585, 358 540 Z"/>
    <path fill="white" opacity="0.36" d="M 700 555 C 780 540, 865 558, 878 605 C 888 645, 812 682, 728 670 C 668 661, 650 578, 700 555 Z"/>
    <path fill="white" opacity="0.36" d="M 905 210 C 965 192, 1035 215, 1048 275 C 1058 330, 1015 385, 952 378 C 900 372, 872 305, 890 255 C 896 235, 888 218, 905 210 Z"/>
    <path fill="white" opacity="0.28" d="M 950 470 C 1000 458, 1052 485, 1045 535 C 1038 580, 982 602, 942 578 C 910 558, 918 492, 950 470 Z"/>
    <path fill="white" opacity="0.3" d="M 480 92 C 555 74, 650 72, 705 92 C 745 107, 690 138, 600 136 C 528 134, 442 112, 480 92 Z"/>
    <path fill="white" opacity="0.25" d="M 810 78 C 878 68, 952 82, 972 112 C 988 136, 928 158, 855 150 C 800 144, 772 96, 810 78 Z"/>
  </g>
  <g filter="url(#soft2)">
    <circle cx="112" cy="290" r="30" fill="white" opacity="0.13"/>
    <circle cx="1160" cy="240" r="28" fill="white" opacity="0.12"/>
    <circle cx="1150" cy="470" r="24" fill="white" opacity="0.11"/>
    <circle cx="250" cy="600" r="28" fill="white" opacity="0.11"/>
    <circle cx="880" cy="660" r="26" fill="white" opacity="0.1"/>
    <circle cx="660" cy="52" r="24" fill="white" opacity="0.11"/>
  </g>
</svg>
