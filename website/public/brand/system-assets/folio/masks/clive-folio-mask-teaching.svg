<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    Living Folio — Clive teaching mask (4:3, left page).
    Absorbed-pigment alpha. One mask on the OUTERMOST wrapper only.

    ALPHA ARCHITECTURE (Kathryn dispatch, 6 Aug 2026): three INDEPENDENTLY
    irregular absorption fields, not one displaced contour. The earlier
    single silhouette + uniform falloff kept too much alpha too close to a
    single closed contour, so the darkest room pixels (bookshelves, the
    fireplace) collected into a legible brown/grey oval ring — a torn
    aperture. The fields below are displaced and gated by DIFFERENT noise
    seeds so their edges never align; the eye finds no one contour to trace.

      1. SOLID CORE — 100% alpha around face, torso, paws and book;
         displaced by its own swell field so even its perimeter is organic.
      2. MID WASH — a broader artwork-shaped field (books and lamp bleed
         far left, fireplace right, broader shoulders, irregular top-shelf
         loss) held to roughly 30-50% alpha by a mid ramp, displaced
         differently and broken by an island gate.
      3. OUTER TRACE — only sparse broken ISLANDS (disconnected small
         shapes) at roughly 8-18% alpha, coarse paper-tooth breakup; it
         deliberately cannot form a continuous closed loop.

    Every field reaches zero well before the SVG bounds. Alpha loss only —
    no texture over Clive. Luminance mask: white = opaque, grey = partial.
  -->
  <defs>
    <!-- CORE: displaced by its own low-frequency swell; crisp enough to hold
         the safe area but never a hard cut. -->
    <filter id="coreF" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.017 0.021" numOctaves="2" seed="5" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="4" result="b"/>
      <feComponentTransfer in="b">
        <feFuncA type="table" tableValues="0 0.35 0.8 0.97 1 1"/>
      </feComponentTransfer>
    </filter>

    <!-- MID WASH: different displacement seed, mid ramp (caps ~0.5), and an
         island gate so the wash arrives in patches, not a ring. -->
    <filter id="midF" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="29" result="sw"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.048 0.06" numOctaves="3" seed="61" result="fray"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="58" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feDisplacementMap in="d1" in2="fray" scale="18" xChannelSelector="R" yChannelSelector="G" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="9" result="b"/>
      <!-- mid ramp: the field never reaches full alpha anywhere -->
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.04 0.12 0.24 0.36 0.46 0.5 0.5"/>
      </feComponentTransfer>
      <!-- island gate: low-frequency patch field thins the wash irregularly -->
      <feTurbulence type="fractalNoise" baseFrequency="0.026 0.034" numOctaves="2" seed="13" result="patch"/>
      <feComponentTransfer in="patch" result="gate">
        <feFuncA type="table" tableValues="0 0 0.15 0.55 0.9 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="gate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <!-- TRACE: sparse islands only, capped at ~0.18, coarse tooth breakup. -->
    <filter id="traceF" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.027" numOctaves="2" seed="43" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="70" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7" result="b"/>
      <!-- trace ramp: hard ceiling at 0.18 so nothing here ever gathers -->
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.02 0.06 0.11 0.16 0.18 0.18"/>
      </feComponentTransfer>
      <!-- coarse paper tooth: breaks each island into skips and specks -->
      <feTurbulence type="fractalNoise" baseFrequency="0.11 0.14" numOctaves="2" seed="83" result="tooth"/>
      <feComponentTransfer in="tooth" result="toothGate">
        <feFuncA type="table" tableValues="0 0 0.1 0.45 0.8 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="toothGate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- 1. SOLID CORE: face, torso, paws, book and the gesture-safe area. -->
  <path fill="white" filter="url(#coreF)" d="
    M 350 195
    C 480 158, 640 158, 745 196
    C 850 234, 915 330, 912 455
    C 909 585, 835 690, 720 738
    C 600 782, 465 775, 355 720
    C 262 672, 222 575, 232 460
    C 242 345, 268 235, 350 195
    Z"/>

  <!-- 2. MID WASH: the room belonging to the page. Books and the banker's
         lamp bleed far LEFT; the fireplace breathes RIGHT; broader around
         shoulders and book; the top shelf line is lost irregularly; the
         lower fade is quieter. -->
  <path fill="white" filter="url(#midF)" d="
    M 175 260
    C 150 200, 210 160, 300 140
    C 420 96, 620 88, 760 118
    C 890 146, 1000 210, 1045 320
    C 1080 415, 1065 480, 1075 545
    C 1083 610, 1030 700, 940 770
    C 850 838, 720 862, 560 858
    C 420 854, 300 830, 235 760
    C 175 695, 150 610, 158 520
    C 166 430, 195 330, 175 260
    Z"/>

  <!-- 3. OUTER TRACE: sparse broken islands only. Never a closed loop. -->
  <g filter="url(#traceF)">
    <path fill="white" d="M 128 300 C 160 268, 205 262, 225 300 C 244 336, 220 385, 178 392 C 138 399, 105 350, 128 300 Z"/>
    <path fill="white" d="M 262 148 C 305 118, 365 112, 392 142 C 415 168, 380 205, 322 208 C 272 210, 232 180, 262 148 Z"/>
    <path fill="white" d="M 560 84 C 620 66, 690 70, 716 96 C 736 118, 690 142, 616 140 C 556 138, 516 108, 560 84 Z"/>
    <path fill="white" d="M 880 128 C 940 118, 1005 140, 1022 182 C 1035 216, 985 244, 922 232 C 870 222, 842 158, 880 128 Z"/>
    <path fill="white" d="M 1085 300 C 1125 285, 1160 310, 1158 355 C 1156 400, 1118 430, 1080 415 C 1045 401, 1048 318, 1085 300 Z"/>
    <path fill="white" d="M 1095 520 C 1130 510, 1158 545, 1145 595 C 1133 640, 1092 660, 1062 638 C 1035 618, 1058 535, 1095 520 Z"/>
    <path fill="white" d="M 905 790 C 955 775, 1010 795, 1018 832 C 1024 862, 965 880, 905 868 C 858 858, 865 806, 905 790 Z"/>
    <path fill="white" d="M 585 852 C 650 842, 715 852, 728 878 C 738 898, 665 908, 595 900 C 545 894, 535 864, 585 852 Z"/>
    <path fill="white" d="M 300 800 C 350 795, 395 822, 388 855 C 381 885, 315 885, 272 862 C 238 843, 255 808, 300 800 Z"/>
    <path fill="white" d="M 118 560 C 158 545, 195 572, 190 620 C 185 665, 140 690, 105 668 C 75 648, 85 578, 118 560 Z"/>
  </g>
</svg>
