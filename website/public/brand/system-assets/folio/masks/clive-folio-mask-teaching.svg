<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Living Folio — Clive teaching mask (4:3). v6.
       Pure-vector absorbed pigment. v5 passed the cold gate but read too
       eaten (islands shrank to specks, fireplace vanished). v6 enlarges and
       merges the wash into fewer, broader, irregular absorption fields that
       still never close into a continuous contour. Solid core on Clive. -->
  <defs>
    <filter id="broad" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.038" numOctaves="2" seed="14" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="40" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- SOLID CORE: Clive's head, torso, paws, book. -->
  <path fill="white" filter="url(#rough)" d="
    M 468 214
    C 556 178, 662 184, 728 236
    C 786 282, 812 352, 806 458
    C 800 566, 758 652, 688 700
    C 614 748, 522 744, 454 698
    C 392 654, 370 568, 380 470
    C 390 376, 406 250, 468 214
    Z"/>

  <!-- Broad absorption fields (broken, no continuous contour). -->
  <!-- LEFT: lamp + shelf wash, generous bleed, irregular -->
  <path fill="white" opacity="0.52" filter="url(#broad)" d="
    M 168 268
    C 150 200, 225 158, 330 152
    C 415 147, 480 178, 500 245
    C 518 305, 500 380, 448 425
    C 400 466, 320 480, 252 462
    C 190 445, 152 390, 152 322
    C 152 290, 158 282, 168 268
    Z"/>
  <path fill="white" opacity="0.42" filter="url(#broad)" d="
    M 150 470
    C 185 425, 265 418, 320 452
    C 368 482, 372 555, 322 598
    C 278 636, 195 632, 158 585
    C 128 546, 122 508, 150 470
    Z"/>
  <!-- RIGHT: fireplace wash, irregular, broken -->
  <path fill="white" opacity="0.5" filter="url(#broad)" d="
    M 800 280
    C 850 240, 940 235, 1000 278
    C 1052 316, 1065 395, 1030 455
    C 998 510, 920 535, 858 512
    C 802 491, 772 432, 780 368
    C 785 322, 776 300, 800 280
    Z"/>
  <path fill="white" opacity="0.4" filter="url(#broad)" d="
    M 820 520
    C 870 495, 950 505, 985 552
    C 1015 592, 995 655, 938 678
    C 885 698, 812 678, 792 625
    C 778 585, 782 542, 820 520
    Z"/>
  <!-- TOP shelf loss -->
  <path fill="white" opacity="0.44" filter="url(#broad)" d="
    M 380 138
    C 460 100, 600 92, 700 112
    C 780 128, 830 165, 822 200
    C 815 232, 720 250, 600 248
    C 480 246, 380 215, 368 178
    C 360 158, 362 146, 380 138
    Z"/>
  <!-- BOTTOM: quiet fade wash under shoulders/book -->
  <path fill="white" opacity="0.46" filter="url(#broad)" d="
    M 330 680
    C 420 648, 560 650, 660 678
    C 745 702, 800 745, 792 782
    C 785 818, 680 845, 560 842
    C 445 839, 340 800, 322 745
    C 312 715, 312 692, 330 680
    Z"/>
  <!-- sparse far trace -->
  <g filter="url(#broad)">
    <circle cx="118" cy="640" r="42" fill="white" opacity="0.16"/>
    <circle cx="1060" cy="580" r="38" fill="white" opacity="0.15"/>
    <circle cx="250" cy="820" r="40" fill="white" opacity="0.14"/>
    <circle cx="900" cy="820" r="36" fill="white" opacity="0.13"/>
  </g>
</svg>
