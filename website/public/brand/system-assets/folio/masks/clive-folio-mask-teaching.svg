<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    Living Folio — Clive teaching mask (4:3, left page).
    Hand-shaped absorbed-ink alpha. One mask on the OUTERMOST wrapper only.

    Character: a broad, vertically generous silhouette with an irregular
    dry-brush perimeter — flat-ish top and bottom, fuller and more broken
    along the left/right edges, asymmetric. The centre (face, torso, paws
    and book) stays fully solid; the perimeter dissolves into the Pale Cream
    page as ink absorbed into paper.

    Rim correction (Kathryn dispatch, 6 Aug 2026): the prior version left a
    dense dark stippled necklace — a continuous charcoal band where the
    steep ramp met a uniform sharpened tooth. Fixed three ways, all in the
    filter (the hand-authored path is unchanged):
      1. Alpha decays FASTER through the darkest room pixels so no
         continuous ring survives — the ramp now collapses to zero sooner
         and the blur is shorter, so the falloff is pigment THINNING, not
         pigment gathering at the edge.
      2. The tooth bite is no longer uniform: a low-frequency directional
         field modulates the tooth so it bites in irregular ISLANDS, not a
         fence around the whole perimeter. Paper intrudes inward in broken
         patches.
      3. Fewer fully-opaque outer teeth — the outermost fringe is held at
         low alpha so it reads as broken dry-brush, never a solid band.
    A guaranteed solid core keeps the safe area 100% opaque.
  -->
  <defs>
    <filter id="ink" x="-14%" y="-14%" width="128%" height="128%" color-interpolation-filters="sRGB">
      <!-- Coarse fibre field (the paper tooth) + fine fray, one displacement. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="2" seed="19" result="swell"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.052 0.068" numOctaves="3" seed="41" result="fray"/>
      <feDisplacementMap in="SourceGraphic" in2="swell" scale="42" xChannelSelector="R" yChannelSelector="G" result="rough1"/>
      <feDisplacementMap in="rough1" in2="fray" scale="16" xChannelSelector="R" yChannelSelector="G" result="rough"/>

      <!-- Faster absorbed-ink decay: shorter soft blur, then a ramp that
           reaches zero sooner so the outer fringe is thin low-alpha wash,
           not a gathered dark edge. -->
      <feGaussianBlur in="rough" stdDeviation="6" result="soft"/>
      <feComponentTransfer in="soft" result="ramped">
        <feFuncA type="table" tableValues="0 0 0 0.02 0.1 0.3 0.58 0.85 0.97 1 1"/>
      </feComponentTransfer>

      <!-- Irregular island bite: a LOW-frequency field breaks the bite into
           patches so paper intrudes inward in islands, not a fenced ring. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.038" numOctaves="2" seed="7" result="patch"/>
      <feComponentTransfer in="patch" result="patchGate">
        <feFuncA type="table" tableValues="0 0 0.1 0.5 0.85 1 1"/>
      </feComponentTransfer>

      <!-- Fine paper tooth, gated by the patch field and weakened (k3 -0.3)
           so it removes pigment in broken specks rather than a uniform band. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.17" numOctaves="2" seed="77" result="tooth"/>
      <feComponentTransfer in="tooth" result="toothSharp">
        <feFuncA type="table" tableValues="0 0 0 0.25 0.7 1 1"/>
      </feComponentTransfer>
      <feComposite in="toothSharp" in2="patchGate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="islandTooth"/>

      <!-- Subtract the island bite from the ramp: granular loss in patches. -->
      <feComposite in="ramped" in2="islandTooth" operator="arithmetic" k1="0" k2="1" k3="-0.3" k4="0"/>
    </filter>
  </defs>

  <!-- Hand-shaped silhouette: broad, vertically generous, asymmetric.
       Deliberately not an ellipse: flatter crown and base, fuller flanks,
       a few uneven brush swells along the sides. -->
  <path fill="white" filter="url(#ink)" d="
    M 300 128
    C 430 84, 620 78, 742 116
    C 858 152, 986 226, 1020 342
    C 1046 434, 1030 566, 1004 668
    C 966 776, 852 838, 724 854
    C 596 868, 430 856, 316 812
    C 206 770, 122 686, 108 566
    C 96 452, 118 322, 168 226
    C 206 156, 248 144, 300 128
    Z"/>

  <!-- Guaranteed solid safe area: face, torso, paws and book fully opaque.
       Sits inside the silhouette, untouched by the edge noise. -->
  <path fill="white" opacity="1" d="
    M 330 190
    C 470 150, 640 150, 760 190
    C 880 230, 960 330, 960 460
    C 960 600, 880 720, 740 770
    C 600 812, 440 800, 330 740
    C 232 686, 188 580, 196 460
    C 204 342, 240 232, 330 190
    Z"/>
</svg>
