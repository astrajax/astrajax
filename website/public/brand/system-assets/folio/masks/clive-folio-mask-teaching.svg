<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    Living Folio — Clive teaching mask (4:3, left page). v3.
    Absorbed-pigment alpha. One mask on the OUTERMOST wrapper only.

    v3 (Kathryn cold gate, 6 Aug 2026): v2 failed — the ~50% MID WASH was
    still one closed contour and the dark bookshelf/fireplace pixels
    gathered along it, so a ring still traced. Fixed by construction:
      - SOLID CORE shrunk HARD onto Clive (face, torso, paws, book) so the
        dark periphery is no longer held at full alpha on a big oval.
      - MID WASH lowered to ~25-34% alpha, broken into patches, and the
        darkest zones (fireplace right, upper shelf line) are CUT OUT of
        the wash path so no dark pigment can collect on any curve.
      - OUTER TRACE: sparse broken islands at ~8-14% alpha, coarse tooth.
    Every field reaches zero well before the SVG bounds. Alpha loss only.
  -->
  <defs>
    <filter id="coreF" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.024" numOctaves="2" seed="5" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="3.5" result="b"/>
      <feComponentTransfer in="b">
        <feFuncA type="table" tableValues="0 0.4 0.85 0.98 1 1"/>
      </feComponentTransfer>
    </filter>

    <filter id="midF" x="-16%" y="-16%" width="132%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="29" result="sw"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.07" numOctaves="3" seed="61" result="fray"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="52" xChannelSelector="R" yChannelSelector="G" result="d1"/>
      <feDisplacementMap in="d1" in2="fray" scale="16" xChannelSelector="R" yChannelSelector="G" result="d2"/>
      <feGaussianBlur in="d2" stdDeviation="8" result="b"/>
      <!-- wash capped lower: ~0.34 ceiling -->
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.03 0.08 0.15 0.23 0.3 0.34 0.34"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="2" seed="13" result="patch"/>
      <feComponentTransfer in="patch" result="gate">
        <feFuncA type="table" tableValues="0 0 0.1 0.45 0.85 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="gate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="traceF" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.024 0.03" numOctaves="2" seed="43" result="sw"/>
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="60" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6" result="b"/>
      <feComponentTransfer in="b" result="ramp">
        <feFuncA type="table" tableValues="0 0 0.02 0.05 0.09 0.13 0.14 0.14"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.12 0.15" numOctaves="2" seed="83" result="tooth"/>
      <feComponentTransfer in="tooth" result="toothGate">
        <feFuncA type="table" tableValues="0 0 0.08 0.4 0.8 1 1"/>
      </feComponentTransfer>
      <feComposite in="ramp" in2="toothGate" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- 1. SOLID CORE: shrunk hard onto Clive — face, torso, paws, book.
         Left/right bounds now sit on his body, not on the dark room. -->
  <path fill="white" filter="url(#coreF)" d="
    M 470 220
    C 560 185, 660 190, 720 235
    C 775 278, 800 350, 795 450
    C 790 555, 750 640, 680 685
    C 610 728, 520 725, 455 680
    C 395 638, 370 560, 378 465
    C 386 372, 405 258, 470 220
    Z"/>

  <!-- 2. MID WASH: room belonging, ~25-34%, in patches. The fireplace
         (right) and the upper shelf line are CUT OUT of this path so dark
         pigment cannot collect on any curve. -->
  <path fill="white" filter="url(#midF)" fill-rule="evenodd" d="
    M 200 280
    C 175 215, 250 175, 345 158
    C 460 118, 630 112, 745 138
    C 845 160, 920 220, 950 305
    C 975 385, 962 470, 940 545
    C 915 625, 845 700, 745 748
    C 640 798, 480 800, 360 752
    C 255 710, 195 625, 205 520
    C 215 425, 228 350, 200 280
    Z
    M 760 300
    C 830 285, 900 310, 912 380
    C 922 445, 900 520, 850 560
    C 805 595, 750 585, 735 520
    C 722 462, 716 345, 760 300
    Z
    M 360 150
    C 470 118, 640 112, 742 138
    C 790 150, 742 178, 640 182
    C 520 187, 400 178, 360 150
    Z"/>

  <!-- 3. OUTER TRACE: sparse broken islands only, ~8-14%. -->
  <g filter="url(#traceF)">
    <path fill="white" d="M 140 320 C 168 292, 208 288, 224 320 C 240 352, 218 394, 180 398 C 144 402, 116 356, 140 320 Z"/>
    <path fill="white" d="M 280 162 C 318 136, 372 132, 396 158 C 416 180, 380 208, 326 206 C 280 204, 250 184, 280 162 Z"/>
    <path fill="white" d="M 590 96 C 645 82, 710 88, 730 110 C 746 128, 700 148, 632 144 C 578 141, 548 114, 590 96 Z"/>
    <path fill="white" d="M 880 140 C 932 132, 990 152, 1004 188 C 1015 218, 970 242, 912 232 C 866 224, 846 160, 880 140 Z"/>
    <path fill="white" d="M 1080 330 C 1115 318, 1148 342, 1145 382 C 1142 422, 1108 448, 1074 434 C 1044 421, 1048 346, 1080 330 Z"/>
    <path fill="white" d="M 1075 545 C 1108 536, 1135 568, 1122 612 C 1110 652, 1072 668, 1045 648 C 1021 630, 1042 556, 1075 545 Z"/>
    <path fill="white" d="M 880 780 C 925 768, 975 786, 982 818 C 987 844, 933 860, 878 848 C 836 839, 842 794, 880 780 Z"/>
    <path fill="white" d="M 560 838 C 618 830, 676 838, 688 860 C 696 876, 632 886, 570 880 C 526 875, 518 848, 560 838 Z"/>
    <path fill="white" d="M 300 792 C 344 786, 384 810, 377 838 C 370 864, 312 864, 272 844 C 242 827, 258 798, 300 792 Z"/>
    <path fill="white" d="M 132 585 C 166 570, 200 594, 195 636 C 190 676, 150 698, 118 678 C 90 660, 100 602, 132 585 Z"/>
  </g>
</svg>
